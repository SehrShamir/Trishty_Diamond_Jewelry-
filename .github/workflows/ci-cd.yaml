name: CI/CD - Build and Push Medusa Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push-backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            everythingtalentdeveloper/medusa-docker:backend
            everythingtalentdeveloper/medusa-docker:backend-${{ github.sha }}

  build-and-push-storefront:
    name: Build and Push Storefront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Storefront
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          push: true
          tags: |
            everythingtalentdeveloper/medusa-docker:storefront
            everythingtalentdeveloper/medusa-docker:storefront-${{ github.sha }}
